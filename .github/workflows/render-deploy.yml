name: Deploy Backend to Render

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK secret not set — skipping"
            echo ""
            echo "To enable auto-deploy, add your Render deploy hook URL as a GitHub secret:"
            echo "  1. Open your Render service → Settings → Deploy Hook"
            echo "  2. Copy the URL (looks like https://api.render.com/deploy/srv-...)"
            echo "  3. Go to https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  4. Add a new secret:  Name = RENDER_DEPLOY_HOOK,  Value = <the URL>"
            exit 0
          fi

          echo "🚀 Triggering Render deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Render deploy triggered (HTTP $HTTP_CODE)"
          else
            echo "❌ Failed (HTTP $HTTP_CODE)"
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}