name: Deploy Backend to Render

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "prisma/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Render Deploy via API
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "⚠️  RENDER_API_KEY secret not set — skipping"
            echo ""
            echo "To enable auto-deploy, add your Render API key as a GitHub secret:"
            echo "  1. Go to https://dashboard.render.com/account/api-keys"
            echo "  2. Create or copy your API key (starts with rnd_...)"
            echo "  3. Go to https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  4. Add a new secret:  Name = RENDER_API_KEY,  Value = <the key>"
            exit 0
          fi

          echo "🚀 Triggering Render deployment for service $RENDER_SERVICE_ID..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            DEPLOY_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "unknown")
            echo "✅ Render deploy triggered successfully (HTTP $HTTP_CODE)"
            echo "   Deploy ID: $DEPLOY_ID"
            echo "   Service:   $RENDER_SERVICE_ID"
          else
            echo "❌ Failed to trigger Render deploy (HTTP $HTTP_CODE)"
            echo "   Response: $BODY"
            exit 1
          fi
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}