<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D7A4E"/>
      <stop offset="100%" style="stop-color:#0B5E3C"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Building icon -->
  <g transform="translate(256,256)" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main building -->
    <rect x="-100" y="-60" width="200" height="200" rx="8" fill="rgba(255,255,255,0.12)" stroke="#ffffff"/>
    <!-- Roof peak -->
    <polyline points="-120,-60 0,-140 120,-60" fill="rgba(255,255,255,0.08)" stroke="#ffffff"/>
    <!-- Windows row 1 -->
    <rect x="-70" y="-20" width="40" height="40" rx="4" fill="rgba(255,255,255,0.2)" stroke="#ffffff"/>
    <rect x="30" y="-20" width="40" height="40" rx="4" fill="rgba(255,255,255,0.2)" stroke="#ffffff"/>
    <!-- Windows row 2 -->
    <rect x="-70" y="50" width="40" height="40" rx="4" fill="rgba(255,255,255,0.2)" stroke="#ffffff"/>
    <rect x="30" y="50" width="40" height="40" rx="4" fill="rgba(255,255,255,0.2)" stroke="#ffffff"/>
    <!-- Door -->
    <rect x="-20" y="90" width="40" height="50" rx="4" fill="rgba(255,255,255,0.15)" stroke="#ffffff"/>
    <!-- Wrench overlay (maintenance) -->
    <g transform="translate(90,-100) rotate(45)" stroke-width="14">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#ffffff" opacity="0.9"/>
      <circle cx="-30" cy="-30" r="20" fill="none" stroke="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>