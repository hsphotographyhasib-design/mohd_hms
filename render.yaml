# Render.com Blueprint — at repository root
# Matches existing service name: mohd-hms
#
# IMPORTANT: If the existing service was created as Node.js,
# you MUST manually change its Environment to "Docker" in the
# Render Dashboard (Settings → Environment). The Blueprint alone
# cannot change the runtime of an existing service.

services:
  - type: web
    name: mohd-hms
    rootDir: backend
    env: docker
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: APP_NAME
        value: "MOHD.HMS ENTERPRISE"
      - key: APP_VERSION
        value: "1.0.0"
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_ACCESS_TOKEN_EXPIRE
        value: "604800"
      - key: EMAIL_PORT
        value: "587"
      # Secrets — set these in Render Dashboard, NOT here
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
