# =============================================================================
# FacilityPro — Nginx Server Block
# =============================================================================
# Replace "your-domain.com" with your actual domain name.
# After updating, run:  deploy/ssl-setup.sh your-domain.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # ── Let's Encrypt ACME Challenge ────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── HTTP → HTTPS Redirect ──────────────────────────────────────────────
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS Server Block
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL Configuration ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/facilitypro_access.log;
    error_log  /var/log/nginx/facilitypro_error.log;

    # ── XTransformPort Routing ─────────────────────────────────────────────
    # This replicates the Caddy gateway behaviour used in development.
    # Requests with ?XTransformPort=3003 are proxied to the WhatsApp service.
    # All other requests go to the main Next.js app.

    # Route to WhatsApp service when XTransformPort=3003 is present
    set $backend "app_backend";
    if ($arg_XTransformPort = "3003") {
        set $backend "whatsapp_backend";
    }

    # ── WebSocket Support (for Socket.IO / WhatsApp) ───────────────────────
    location /socket.io/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Main Proxy (handles both app and XTransformPort routing) ────────────
    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer settings for large responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── Next.js Static Assets (long cache) ─────────────────────────────────
    location /_next/static/ {
        proxy_pass http://app_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Favicon & Public Files ─────────────────────────────────────────────
    location = /favicon.ico {
        proxy_pass http://app_backend;
        access_log off;
        log_not_found off;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://app_backend;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}