# =============================================================================
# Docker Compose — Full Stack (App + Nginx + optional WhatsApp)
# =============================================================================
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    container_name: my-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db_data:/app/db
      - upload_storage:/app/storage
      - whatsapp_sessions:/app/mini-services/whatsapp-service/storage/sessions
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      - STORAGE_ROOT=/app/storage
      - CHROME_PATH=/usr/bin/chromium
      - DISPLAY=:99
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # WhatsApp Mini-Service (optional — needs Chrome/Xvfb)
  # Uncomment the section below to run the WhatsApp service as a separate container.
  # Comment out the whatsapp build in the main Dockerfile if using this approach.
  # ---------------------------------------------------------------------------
  # whatsapp:
  #   build:
  #     context: ../
  #     dockerfile: deploy/Dockerfile.whatsapp
  #   container_name: my-whatsapp
  #   restart: unless-stopped
  #   ports:
  #     - "3003:3003"
  #   volumes:
  #     - whatsapp_sessions:/app/storage/sessions
  #   environment:
  #     - NODE_ENV=production
  #     - CHROME_PATH=/usr/bin/chromium
  #     - DISPLAY=:99
  #     - PORT=3003
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3003/"]
  #     interval: 30s
  #     timeout: 10s
  #     start_period: 20s
  #     retries: 3
  #   networks:
  #     - app-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: my-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  db_data:
    driver: local
  upload_storage:
    driver: local
  whatsapp_sessions:
    driver: local
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge