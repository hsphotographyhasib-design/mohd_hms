# =============================================================================
# Docker Compose — Production Overrides
# =============================================================================
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
# =============================================================================

services:
  app:
    # Resource limits for the Next.js app
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.5"
    # Production logging — limit log size to prevent disk exhaustion
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Remove port binding in production; traffic flows through Nginx only
    # Uncomment below to bind internally within the Docker network only:
    # ports:
    #   - "127.0.0.1:3000:3000"

  # whatsapp:
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2G
  #         cpus: "1.0"
  #       reservations:
  #         memory: 512M
  #         cpus: "0.25"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "50m"
  #       max-file: "5"
  #   # Bind WhatsApp service to localhost only (not publicly accessible)
  #   ports:
  #     - "127.0.0.1:3003:3003"

  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"