services:
  - type: web
    name: mohd-hms-backend
    runtime: docker
    plan: starter
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false